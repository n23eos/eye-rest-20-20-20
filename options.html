<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Настройки — Отдых для глаз</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="options">
    <header class="options-header">
      <img src="icons/icon48.png" alt="" class="options-icon">
      <h1 class="options-title">Отдых для глаз — настройки</h1>
    </header>

    <section class="card">
      <h2 class="card-title">👀 Напоминания для глаз</h2>

      <div class="field">
        <label class="field-label" for="eyeIntervalMinutes">
          Напоминать каждые
          <span class="field-hint">по правилу 20-20-20 — каждые 20 минут</span>
        </label>
        <div class="field-control">
          <input type="number" id="eyeIntervalMinutes" min="1" max="180">
          <span class="field-unit">мин</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="restSeconds">
          Длительность отдыха
          <span class="field-hint">сколько секунд смотреть вдаль</span>
        </label>
        <div class="field-control">
          <input type="number" id="restSeconds" min="5" max="300">
          <span class="field-unit">сек</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="notificationType">
          Как напоминать
          <span class="field-hint">окно с инструкцией труднее проигнорировать</span>
        </label>
        <div class="field-control">
          <select id="notificationType">
            <option value="overlay">Окно с инструкцией 20-20-20</option>
            <option value="notification">Системное уведомление</option>
            <option value="both">И окно, и уведомление</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="isSoundEnabled">
          Звук
          <span class="field-hint">
            сигнал в окне отдыха. В режиме «системное уведомление»
            звук играет сама система
          </span>
        </label>
        <div class="field-control">
          <input type="checkbox" id="isSoundEnabled" class="field-checkbox">
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="soundName">
          Какой звук
          <span class="field-hint">нажми «Прослушать», чтобы выбрать на слух</span>
        </label>
        <div class="field-control">
          <select id="soundName"></select>
          <button class="play-button" id="playSoundButton" type="button">▶ Прослушать</button>
        </div>
      </div>

      <button class="preview-button" id="previewButton">Показать окно отдыха сейчас</button>
    </section>

    <section class="card">
      <h2 class="card-title">🍅 Помодоро</h2>

      <div class="field">
        <label class="field-label" for="workMinutes">Работа</label>
        <div class="field-control">
          <input type="number" id="workMinutes" min="1" max="180">
          <span class="field-unit">мин</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="shortBreakMinutes">Короткий перерыв</label>
        <div class="field-control">
          <input type="number" id="shortBreakMinutes" min="1" max="60">
          <span class="field-unit">мин</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="longBreakMinutes">Длинный перерыв</label>
        <div class="field-control">
          <input type="number" id="longBreakMinutes" min="1" max="120">
          <span class="field-unit">мин</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="cyclesBeforeLongBreak">
          Циклов до длинного перерыва
        </label>
        <div class="field-control">
          <input type="number" id="cyclesBeforeLongBreak" min="2" max="12">
          <span class="field-unit">шт</span>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">📊 Статистика</h2>
      <p class="stats-line" id="statsLine">Загружаю…</p>
      <button class="danger-button" id="resetStatsButton">Сбросить статистику</button>
    </section>

    <p class="saved-toast" id="savedToast" hidden>Сохранено ✓</p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
