<!DOCTYPE html>
<html lang="en" data-i18n-title="optionsTitle">
<head>
  <meta charset="UTF-8">
  <title>Eye Rest — settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="options">
    <header class="options-header">
      <img src="icons/icon48.png" alt="" class="options-icon">
      <h1 class="options-title" data-i18n="optionsTitle"></h1>
    </header>

    <section class="card">
      <h2 class="card-title" data-i18n="cardEyes"></h2>

      <div class="field">
        <label class="field-label" for="eyeIntervalMinutes">
          <span data-i18n="fieldInterval"></span>
          <span class="field-hint" data-i18n="fieldIntervalHint"></span>
        </label>
        <div class="field-control">
          <input type="number" id="eyeIntervalMinutes" min="1" max="180">
          <span class="field-unit" data-i18n="unitMinutes"></span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="restSeconds">
          <span data-i18n="fieldRestSeconds"></span>
          <span class="field-hint" data-i18n="fieldRestSecondsHint"></span>
        </label>
        <div class="field-control">
          <input type="number" id="restSeconds" min="5" max="300">
          <span class="field-unit" data-i18n="unitSeconds"></span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="notificationType">
          <span data-i18n="fieldNotificationType"></span>
          <span class="field-hint" data-i18n="fieldNotificationTypeHint"></span>
        </label>
        <div class="field-control">
          <select id="notificationType">
            <option value="overlay" data-i18n="optionOverlay"></option>
            <option value="notification" data-i18n="optionNotification"></option>
            <option value="both" data-i18n="optionBoth"></option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="isSoundEnabled">
          <span data-i18n="fieldSound"></span>
          <span class="field-hint" data-i18n="fieldSoundHint"></span>
        </label>
        <div class="field-control">
          <input type="checkbox" id="isSoundEnabled" class="field-checkbox">
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="soundName">
          <span data-i18n="fieldSoundName"></span>
          <span class="field-hint" data-i18n="fieldSoundNameHint"></span>
        </label>
        <div class="field-control">
          <select id="soundName"></select>
          <button class="play-button" id="playSoundButton" type="button" data-i18n="playSound"></button>
        </div>
      </div>

      <button class="preview-button" id="previewButton" data-i18n="previewRestButton"></button>
    </section>

    <section class="card">
      <h2 class="card-title" data-i18n="cardPomodoro"></h2>

      <div class="field">
        <label class="field-label" for="workMinutes" data-i18n="fieldWork"></label>
        <div class="field-control">
          <input type="number" id="workMinutes" min="1" max="180">
          <span class="field-unit" data-i18n="unitMinutes"></span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="shortBreakMinutes" data-i18n="fieldShortBreak"></label>
        <div class="field-control">
          <input type="number" id="shortBreakMinutes" min="1" max="60">
          <span class="field-unit" data-i18n="unitMinutes"></span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="longBreakMinutes" data-i18n="fieldLongBreak"></label>
        <div class="field-control">
          <input type="number" id="longBreakMinutes" min="1" max="120">
          <span class="field-unit" data-i18n="unitMinutes"></span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="cyclesBeforeLongBreak" data-i18n="fieldCycles"></label>
        <div class="field-control">
          <input type="number" id="cyclesBeforeLongBreak" min="2" max="12">
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title" data-i18n="cardStats"></h2>
      <p class="stats-line" id="statsLine"></p>
      <button class="danger-button" id="resetStatsButton" data-i18n="resetStats"></button>
    </section>

    <p class="saved-toast" id="savedToast" hidden data-i18n="saved"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
